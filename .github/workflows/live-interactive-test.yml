name: Live Interactive Model Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  live-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build echollama
        run: go build -o echollama .

      - name: Start echollama server (background on 127.0.0.1:11434)
        run: |
          OLLAMA_HOST=127.0.0.1:11434 ./echollama serve &
          # Wait for server to be ready
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:11434/healthz > /dev/null 2>&1; then
              echo "Server is ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Confirm echollama server is live
        run: |
          curl -v http://127.0.0.1:11434/healthz

      - name: Pull real test model (qwen2.5:0.5b)
        run: |
          OLLAMA_HOST=127.0.0.1:11434 ./echollama pull qwen2.5:0.5b

      - name: Confirm model is listed
        run: |
          OLLAMA_HOST=127.0.0.1:11434 ./echollama list

      - name: Run interactive generate requests with timestamps
        run: |
          TS1=$(date --iso-8601=ns)
          TS2=$(date --iso-8601=ns)

          echo "--- Request 1 (timestamp: $TS1) ---"
          curl -sf -X POST http://127.0.0.1:11434/api/generate \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"qwen2.5:0.5b\",\"prompt\":\"Reply in one sentence. The current timestamp is: $TS1\",\"stream\":false}" \
            | tee response1.json

          echo ""
          echo "--- Request 2 (timestamp: $TS2) ---"
          curl -sf -X POST http://127.0.0.1:11434/api/generate \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"qwen2.5:0.5b\",\"prompt\":\"Reply in one sentence. The current timestamp is: $TS2\",\"stream\":false}" \
            | tee response2.json

      - name: Run interactive chat request
        run: |
          curl -sf -X POST http://127.0.0.1:11434/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"model":"qwen2.5:0.5b","messages":[{"role":"user","content":"Say hello in exactly five words."}],"stream":false}' \
            | tee chat_response.json

      - name: Show full responses
        run: |
          echo "=== generate response 1 ==="
          jq . response1.json
          echo "=== generate response 2 ==="
          jq . response2.json
          echo "=== chat response ==="
          jq . chat_response.json

      - name: Verify responses contain generated tokens
        run: |
          R1_EVAL=$(jq '.eval_count' response1.json)
          R2_EVAL=$(jq '.eval_count' response2.json)
          CHAT_EVAL=$(jq '.eval_count' chat_response.json)

          echo "Generate response 1 eval_count: $R1_EVAL"
          echo "Generate response 2 eval_count: $R2_EVAL"
          echo "Chat response eval_count:       $CHAT_EVAL"

          test "$R1_EVAL" -gt 0    || (echo "ERROR: response1 has no eval_count" && exit 1)
          test "$R2_EVAL" -gt 0    || (echo "ERROR: response2 has no eval_count" && exit 1)
          test "$CHAT_EVAL" -gt 0  || (echo "ERROR: chat_response has no eval_count" && exit 1)

          echo "All responses verified — live interactive test passed."
